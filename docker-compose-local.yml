services:
  quiz-redis:
    image: redis:7-alpine
    container_name: quiz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - quiz-network

  quiz-db:
    image: postgres:15.6-alpine
    container_name: quiz-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c timezone=UTC
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  quiz-mongo:
    image: mongo:7-jammy
    container_name: quiz-mongo
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  quiz_back:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: quiz_back
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_started
      quiz-mongo:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - quiz-network

  quiz_bot:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: quiz_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_started
      quiz-mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - tunnel_data:/tunnel:ro
    command: python -m app.bot.main
    networks:
      - quiz-network

  quiz_webapp:
    image: node:22-alpine
    container_name: quiz_webapp
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://quiz_back:8000
    depends_on:
      - quiz_back
    ports:
      - "5173:5173"
    volumes:
      - ./app/bot/webapp:/app
      - webapp_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    networks:
      - quiz-network

  quiz_cloudflared:
    build:
      context: .
      dockerfile: docker/dev/cloudflared.Dockerfile
    container_name: quiz_cloudflared
    restart: unless-stopped
    depends_on:
      - quiz_webapp
    volumes:
      - tunnel_data:/tunnel
    command: "/usr/local/bin/run-cloudflared"
    networks:
      - quiz-network

  quiz_celery:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: quiz_celery
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_started
      quiz-mongo:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=24
      -Q celery,pdf_ai_queue,ai_test_generator,quiz_session,telegram_quiz
    networks:
      - quiz-network
  quiz_celery_beat:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: quiz_celery_beat
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_started
    volumes:
      - .:/app
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
      - quiz-network

volumes:
  redis_data:
  postgres_data:
  mongo_data:
  tunnel_data:
  webapp_node_modules:

networks:
  quiz-network:
    driver: bridge
