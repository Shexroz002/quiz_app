# Production stack.
#
# TLS is terminated outside this file — by nginx on the host or by Cloudflare.
# Every published port is therefore bound to 127.0.0.1: the proxy reaches them
# over loopback and nothing here is exposed to the internet directly.
#
#   API      127.0.0.1:8000  ->  api.<domen>
#   Mini App 127.0.0.1:8080  ->  webapp.<domen>
#
# Required in .env on top of what the app already reads:
#   BASE_URL             https://api.<domen>          (media URLs are built from it)
#   TELEGRAM_WEBAPP_URL  https://webapp.<domen>/       (the bot's WebApp buttons)
#   VITE_API_BASE_URL    https://api.<domen>           (baked into the Mini App bundle)

services:
  quiz-redis:
    image: redis:7-alpine
    container_name: quiz-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  quiz-db:
    image: postgres:15.6-alpine
    container_name: quiz-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c timezone=UTC
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  # Chat messages live in Mongo and app/main.py opens it at start-up, so the API
  # cannot boot without this service.
  quiz-mongo:
    image: mongo:7-jammy
    container_name: quiz-mongo
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  quiz_back:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: quiz_app_backend:latest
    container_name: quiz_back
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_healthy
      quiz-mongo:
        condition: service_healthy
    # --workers stays at 1: the WebSocket registries are per-process, so a second
    # worker would drop broadcasts between clients on different workers.
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --keep-alive 30
      --worker-tmp-dir /dev/shm
    volumes:
      - ${MEDIA_DIR:-/home/quiz_app/media}:/app/media
    networks:
      - quiz-network

  quiz_bot:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: quiz_app_backend:latest
    container_name: quiz_bot
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_healthy
      quiz-mongo:
        condition: service_healthy
    command: python -m app.bot.main
    volumes:
      - ${MEDIA_DIR:-/home/quiz_app/media}:/app/media
    networks:
      - quiz-network

  # Static bundle only. VITE_API_BASE_URL is compiled in, so a change to it
  # needs a rebuild, not a restart.
  quiz_webapp:
    build:
      context: .
      dockerfile: docker/prod/webapp.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL .env da ko'rsatilishi kerak}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: quiz_webapp
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - quiz-network

  quiz_celery:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: quiz_app_backend:latest
    container_name: quiz_celery
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_healthy
      quiz-mongo:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=24
      -Q celery,pdf_ai_queue,ai_test_generator,quiz_session,telegram_quiz
    # The same directory the API serves /media from: the worker writes the images
    # it extracts from a PDF, and the API has to be able to hand them out.
    volumes:
      - ${MEDIA_DIR:-/home/quiz_app/media}:/app/media
    networks:
      - quiz-network

  quiz_celery_beat:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: quiz_app_backend:latest
    container_name: quiz_celery_beat
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tashkent
    depends_on:
      quiz-db:
        condition: service_healthy
      quiz-redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app beat
      --loglevel=info
      --schedule /tmp/celerybeat-schedule
    networks:
      - quiz-network

volumes:
  redis_data:
  postgres_data:
  mongo_data:

networks:
  quiz-network:
    driver: bridge
