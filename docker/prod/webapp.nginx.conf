# Serves the built Mini App. TLS, the real host name and HSTS belong to the
# proxy in front of this container; here we only hand out files over plain HTTP
# on the loopback port that proxy forwards to.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No X-Frame-Options / frame-ancestors here on purpose: Telegram renders a
    # Mini App inside its own WebView frame, and a deny header breaks it.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset file names carry a content hash, so a cached copy can never be stale.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # index.html is the one file that must not be cached: it is what points at
    # the current asset hashes, so a cached copy keeps a deploy invisible.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
